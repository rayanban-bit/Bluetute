<body><div class="wrap">
<h1>Bluetute — ML Workflow (Reverie Hacks 2026, ML Prompt Engineering track)</h1>
<p class="sub">Diagnose-then-intervene pipeline. Green figures are real benchmark results (30-case set, Google AI Studio / Gemini) — not projected.</p>
<svg viewBox="0 0 1180 1610" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="Bluetute workflow: human input flows through Input Parser, Reasoning Analyzer, Misconception Classifier, Adversarial Critic, Diagnosis Selector, Intervention Planner, and Socratic Tutor to reach the student; a Response Evaluator then checks whether the misconception was resolved, looping back to the Intervention Planner if not, and updating a persistent Student Model throughout.">
<rect x="0" y="0" width="1180" height="1610" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a92a6"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b3441e"/>
  </marker>
  <marker id="arrowStore" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a6fd6"/>
  </marker>
</defs><rect x="130" y="30" width="620" height="64" rx="32" fill="#eef2ff" stroke="#7c86d6" stroke-width="1.6"/><text x="440.0" y="58" font-size="13" font-weight="700" fill="#33399e" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">HUMAN INPUT</text><text x="440.0" y="77" font-size="11.5" font-weight="400" fill="#33399e" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">problem statement + student's answer + shown work (+ prior attempts)</text><line x1="440.0" y1="94" x2="440.0" y2="128" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="140" width="620" height="96" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="166" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">1 · Input Parser</text><text x="150" y="186" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: small/cheap (e.g. Gemini Flash)</text><text x="150" y="204" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: raw text  -&gt;  out: ParsedInput (typed fields)</text><text x="150" y="226" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Normalizes problem, answer, reasoning steps, prior attempts into structured data.</text><line x1="440.0" y1="236" x2="440.0" y2="270" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="282" width="620" height="112" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="308" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">2 · Reasoning Analyzer</text><text x="150" y="328" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: strong reasoner (Gemini Pro-tier / Claude)</text><text x="150" y="346" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: ParsedInput  -&gt;  out: ReasoningAnalysis</text><text x="150" y="368" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Verifies each step; decides CONCEPTUAL vs EXECUTION vs INCOMPLETE vs UNKNOWN.</text><text x="730" y="380" font-size="12" font-weight="700" fill="#1e7a4c" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">benchmarked: v1 90.0% -&gt; v2 100.0% (30/30)</text><line x1="440.0" y1="394" x2="440.0" y2="422" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="337.745" y="404.5" width="204.51" height="19.5" fill="#ffffff" opacity="0.92"/><text x="440.0" y="418" font-size="11.5" font-weight="600" fill="#5b6478" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">if error_type == conceptual</text><rect x="130" y="434" width="620" height="112" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="460" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">3 · Misconception Classifier</text><text x="150" y="480" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: mid-tier reasoner</text><text x="150" y="498" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: ReasoningAnalysis  -&gt;  out: MisconceptionClassification</text><text x="150" y="520" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Selects one id from the fixed taxonomy below — never invents a label.</text><text x="730" y="532" font-size="12" font-weight="700" fill="#1e7a4c" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">benchmarked: 22/23 = 95.7% exact-match</text><line x1="440.0" y1="546" x2="440.0" y2="580" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="592" width="620" height="128" rx="10" fill="#fdf1ea" stroke="#b3441e" stroke-width="1.6"/><text x="150" y="618" font-size="16" font-weight="700" fill="#b3441e" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">4 · Adversarial Critic</text><text x="150" y="638" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: DIFFERENT model/provider (diversity)</text><text x="150" y="656" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: classification + evidence  -&gt;  out: CriticReview</text><text x="150" y="678" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Actively tries to DISPROVE the diagnosis; proposes alternative hypotheses.</text><text x="730" y="706" font-size="12" font-weight="700" fill="#1e7a4c" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">benchmarked: 100% survive (v1 signal: too agreeable)</text><line x1="440.0" y1="720" x2="440.0" y2="754" stroke="#b3441e" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="766" width="620" height="112" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="792" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">5 · Diagnosis Selector</text><text x="150" y="812" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: mid-tier reasoner</text><text x="150" y="830" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: classification + critic review  -&gt;  out: FinalDiagnosis</text><text x="150" y="852" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Reconciles both into ONE final diagnosis; gates whether to intervene at all.</text><text x="730" y="864" font-size="12" font-weight="700" fill="#1e7a4c" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">benchmarked: 19/20 = 95.0% final accuracy</text><line x1="440.0" y1="878" x2="440.0" y2="906" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="337.745" y="888.5" width="204.51" height="19.5" fill="#ffffff" opacity="0.92"/><text x="440.0" y="902" font-size="11.5" font-weight="600" fill="#5b6478" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">if intervention_appropriate</text><rect x="130" y="918" width="620" height="96" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="944" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">6 · Intervention Planner</text><text x="150" y="964" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: mid-tier (policy/decision task)</text><text x="150" y="982" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: FinalDiagnosis + student level  -&gt;  out: InterventionPlan</text><text x="150" y="1004" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Chooses a pedagogical strategy: Socratic question, hint, counterexample, ...</text><line x1="440.0" y1="1014" x2="440.0" y2="1048" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="1060" width="620" height="96" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="1086" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">7 · Socratic Tutor</text><text x="150" y="1106" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: strong NL generation quality</text><text x="150" y="1124" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: InterventionPlan  -&gt;  out: student-facing message</text><text x="150" y="1146" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Writes the message shown to the student — guides toward the fix, never reveals it.</text><line x1="440.0" y1="1156" x2="440.0" y2="1190" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="1202" width="620" height="56" rx="28" fill="#eef2ff" stroke="#7c86d6" stroke-width="1.6"/><text x="440.0" y="1226" font-size="13" font-weight="700" fill="#33399e" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">HUMAN INPUT</text><text x="440.0" y="1244" font-size="11.5" font-weight="400" fill="#33399e" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">student's response to the intervention</text><line x1="440.0" y1="1258" x2="440.0" y2="1292" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="1304" width="620" height="112" rx="10" fill="#f5f7fb" stroke="#c9d0de" stroke-width="1.6"/><text x="150" y="1330" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">8 · Response Evaluator</text><text x="150" y="1350" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">model: mid-tier reasoner</text><text x="150" y="1368" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">in: new response + FinalDiagnosis  -&gt;  out: RESOLVED / PERSISTS</text><text x="150" y="1390" font-size="12.5" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Checks whether the misconception was actually corrected, with evidence.</text><text x="440.0" y="1446" font-size="12" font-weight="700" fill="#5b6478" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">ADAPTIVE LOOP</text><path d="M 170 1434 C 75 1434, 75 966, 130 966" fill="none" stroke="#8a92a6" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="1159.0" font-size="11.5" font-weight="700" fill="#5b6478" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">PERSISTS</text><text x="20" y="1175.0" font-size="11.5" font-weight="700" fill="#5b6478" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">-&gt; new intervention</text><rect x="130" y="1476" width="620" height="84" rx="10" fill="#eaf6ef" stroke="#1e7a4c" stroke-width="1.6"/><line x1="440.0" y1="1416" x2="440.0" y2="1464" stroke="#1e7a4c" stroke-width="2" marker-end="url(#arrow)"/><rect x="545.48" y="1430.5" width="69.03999999999999" height="19.5" fill="#ffffff" opacity="0.92"/><text x="580.0" y="1444" font-size="11.5" font-weight="600" fill="#1e7a4c" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">RESOLVED</text><text x="150" y="1506" font-size="14" font-weight="700" fill="#1e7a4c" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Generate similar/harder problem</text><text x="150" y="1528" font-size="12" font-weight="400" fill="#1c2230" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Tests transfer of understanding on a new item.</text><text x="150" y="1546" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">-&gt; feeds a new attempt back into Node 1</text><rect x="830" y="272" width="280" height="1184" rx="14" fill="#f2ecff" stroke="#8a6fd6" stroke-width="1.6"/><text x="970.0" y="302" font-size="14" font-weight="700" fill="#5133a3" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">STUDENT MODEL</text><text x="970.0" y="322" font-size="10.5" font-weight="400" fill="#5133a3" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">(persistent store, not an LLM call)</text><text x="848" y="346" font-size="10.5" font-weight="700" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Algebra:</text><text x="848" y="362" font-size="10.5" font-weight="400" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">  Linear eq.: strong</text><text x="848" y="378" font-size="10.5" font-weight="400" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">  Neg. signs: weak</text><text x="848" y="394" font-size="10.5" font-weight="400" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">  Distribution: persistent</text><text x="848" y="410" font-size="10.5" font-weight="700" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Functions:</text><text x="848" y="426" font-size="10.5" font-weight="400" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">  Domain: strong</text><text x="848" y="442" font-size="10.5" font-weight="400" fill="#3d2b7a" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">  Inverse fn.: weak</text><text x="970.0" y="1440" font-size="9.5" font-weight="400" fill="#5133a3" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">used to personalize future problems (planned)</text><path d="M 750 806 L 830 362" fill="none" stroke="#8a6fd6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><rect x="762.61" y="564.5" width="54.78" height="19.5" fill="#ffffff" opacity="0.92"/><text x="790.0" y="578.0" font-size="11.5" font-weight="600" fill="#5133a3" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">writes</text><path d="M 750 1344 L 830 412" fill="none" stroke="#8a6fd6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><rect x="762.61" y="874.5" width="54.78" height="19.5" fill="#ffffff" opacity="0.92"/><text x="790.0" y="888.0" font-size="11.5" font-weight="600" fill="#5133a3" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">writes</text><path d="M 830 492 L 750 966" fill="none" stroke="#8a6fd6" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/><text x="838" y="948" font-size="11" font-weight="700" fill="#5133a3" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">reads</text><text x="838" y="964" font-size="11" font-weight="700" fill="#5133a3" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">(planned)</text>
</svg>
